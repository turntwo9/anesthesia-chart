<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anesthesia Record</title>
<style>html,body{margin:0;padding:0;background:#0A0E13}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ------------------------------------------------------------------ */
/*  Interactive anesthesia record — v2                                 */
/*  Preop evaluation carries into the intraop record three ways:       */
/*    1. copied fields      2. derived defaults    3. active flags     */
/* ------------------------------------------------------------------ */

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap');

.ar {
  --field:#0A0E13; --panel:#131A23; --panel2:#18212C;
  --line:#1F2A36; --line-hi:#33445A;
  --ink:#E8EFF5; --muted:#7E8FA0; --dim:#4E5D6B;
  --hr:#3DDC84; --bp:#FF6B7A; --spo2:#56C7F2; --co2:#F5C451; --evt:#C89BF0;
  --crit:#FF4757; --warn:#F5A451;
  background:var(--field); color:var(--ink);
  font-family:'IBM Plex Sans Condensed',system-ui,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
}
.ar *{box-sizing:border-box}
.ar button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
.ar button:focus-visible,.ar input:focus-visible,.ar select:focus-visible{outline:2px solid var(--spo2); outline-offset:1px}
.ar .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ---- header ---- */
.ar-top{display:flex; align-items:stretch; border-bottom:1px solid var(--line-hi); background:var(--panel); flex-wrap:wrap}
.ar-brand{padding:10px 16px; border-right:1px solid var(--line); min-width:148px}
.ar-brand h1{margin:0; font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:700}
.ar-brand p{margin:2px 0 0; font-size:11px; color:var(--dim); letter-spacing:.04em}
.ar-tabs{display:flex; border-right:1px solid var(--line)}
.ar-tab{padding:0 20px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:600;
  color:var(--dim); border-bottom:2px solid transparent}
.ar-tab.on{color:var(--ink); border-bottom-color:var(--spo2)}
.ar-idstrip{display:flex; flex:1; flex-wrap:wrap; align-items:center; gap:0}
.ar-idi{padding:8px 14px; border-right:1px solid var(--line)}
.ar-idi .k{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.ar-idi .v{font-family:'IBM Plex Mono',monospace; font-size:14px; margin-top:2px}
.ar-loaded{display:flex; flex-direction:column; justify-content:center; padding:6px 14px;
  border-left:1px solid var(--line-hi); background:rgba(86,199,242,.07); max-width:260px}
.ar-loaded .k{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.ar-loaded .v{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--spo2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ar-collapse{padding:0 16px; font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim);
  border-left:1px solid var(--line)}

/* ---- case header block ---- */
.ar-hdr{background:var(--panel); border-bottom:1px solid var(--line-hi)}
.ar-hrow{display:flex; flex-wrap:wrap; border-bottom:1px solid var(--line)}
.ar-hrow:last-child{border-bottom:none}
.ar-hf{padding:7px 14px; border-right:1px solid var(--line); flex:1; min-width:132px}
.ar-hf.grow{flex:2.2; min-width:190px}
.ar-hf.tight{flex:0 0 auto; min-width:118px}
.ar-hf label{display:block; font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); margin-bottom:3px}
.ar-hf input{width:100%; background:transparent; border:none; color:var(--ink); padding:0; font-size:15px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}
.ar-hf input[type=text]{font-family:'IBM Plex Sans Condensed',sans-serif}
.ar-hf input::placeholder{color:#38424E}
.ar-hf input::-webkit-calendar-picker-indicator{filter:invert(.55); cursor:pointer}
.ar-hf.calc{background:var(--panel2)}
.ar-hf.calc .out{font-family:'IBM Plex Mono',monospace; font-size:19px; line-height:1.15; color:var(--co2)}
.ar-hf.calc .out.running{color:var(--hr)}
.ar-hf.calc .out em{font-style:normal; font-size:10px; color:var(--dim); letter-spacing:.1em; margin-left:5px}
.ar-hf.times label{color:var(--spo2)}
.ar-hsel{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:2px;
  color:var(--ink); font-family:'IBM Plex Sans Condensed',sans-serif; font-size:14px; padding:3px 5px}
.ar-hsel[data-empty="1"]{color:var(--dim)}
.ar-dob{display:flex; gap:5px}
.ar-dob select{background:var(--panel2); border:1px solid var(--line); border-radius:2px; color:var(--ink);
  font-family:'IBM Plex Sans Condensed',sans-serif; font-size:14px; padding:3px 4px; min-width:0}
.ar-dob select.mo{flex:1.5}
.ar-dob select.dy{flex:1}
.ar-dob select.yr{flex:1.3}
.ar-dob select:invalid,.ar-dob select[data-empty="1"]{color:var(--dim)}
.ar-go{margin:7px 14px; padding:0 18px; border-radius:2px; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; font-weight:700; align-self:center}
.ar-go.start{background:var(--hr); color:#04150C; padding:11px 18px}
.ar-go.stop{border:1px solid var(--line-hi); color:var(--muted); padding:11px 18px}

/* ---- flag strip ---- */
.ar-flagbar{display:flex; gap:6px; padding:7px 12px; background:#0D131A; border-bottom:1px solid var(--line-hi);
  overflow-x:auto; align-items:center; flex-shrink:0}
.ar-chip{flex-shrink:0; padding:5px 10px; border-radius:2px; font-size:11px; font-weight:600;
  letter-spacing:.06em; white-space:nowrap; display:flex; align-items:center; gap:6px}
.ar-chip.crit{background:var(--crit); color:#fff}
.ar-chip.warn{background:transparent; border:1px solid var(--warn); color:var(--warn)}
.ar-chip.info{background:transparent; border:1px solid var(--line-hi); color:var(--muted)}
.ar-chip .n{font-weight:400; opacity:.85}
.ar-flagbar .none{font-size:11px; color:var(--dim); letter-spacing:.1em; text-transform:uppercase}

/* ---- preop ---- */
.ar-preop{flex:1; overflow-y:auto; padding:16px; display:grid; gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); align-content:start}
.ar-card{background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:14px}
.ar-card h2{margin:0 0 12px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--spo2); font-weight:600}
.ar-grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ar-in2{display:block}
.ar-in2 label{display:block; font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin-bottom:4px}
.ar-in2 input,.ar-in2 select{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:2px;
  color:var(--ink); padding:9px 10px; font-size:14px; font-family:'IBM Plex Mono',monospace}
.ar-in2 select{font-family:'IBM Plex Sans Condensed',sans-serif}
.ar-in2.full{grid-column:1 / -1}
.ar-ta.comments{max-width:940px}
.ar-ta{width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:2px;
  color:var(--ink); padding:8px 10px; font-size:13.5px; line-height:1.45; resize:vertical;
  font-family:'IBM Plex Sans Condensed',sans-serif}
.ar-ro{background:transparent; border:1px dashed var(--line-hi); border-radius:2px; padding:9px 10px;
  font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--co2)}
.ar-exam{margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
.ar-examrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:7px}
.ar-examk{width:46px; flex-shrink:0; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.ar-check{display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line-hi);
  border-radius:2px; font-size:12px; color:var(--muted)}
.ar-check i{width:14px; height:14px; border:1px solid var(--line-hi); border-radius:2px; flex-shrink:0}
.ar-check.on{border-color:var(--hr); color:var(--ink)}
.ar-check.on i{background:var(--hr); border-color:var(--hr); position:relative}
.ar-check.on i::after{content:''; position:absolute; left:4px; top:1px; width:4px; height:8px;
  border:solid #04150C; border-width:0 2px 2px 0; transform:rotate(42deg)}
.ar-toggle{display:flex; flex-wrap:wrap; gap:6px}
.ar-tg{padding:8px 11px; border-radius:2px; border:1px solid var(--line-hi); font-size:11.5px; color:var(--muted)}
.ar-tg.on{background:var(--warn); border-color:var(--warn); color:#1A0F03; font-weight:600}
.ar-tg.on.crit{background:var(--crit); border-color:var(--crit); color:#fff}
.ar-derived{margin-top:12px; padding:10px 12px; background:var(--panel2); border-left:2px solid var(--co2); border-radius:2px}
.ar-derived .dl{display:flex; justify-content:space-between; font-size:12px; padding:3px 0}
.ar-derived .dl span:last-child{font-family:'IBM Plex Mono',monospace; color:var(--co2)}
.ar-derived .cap{font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim); margin-bottom:6px}
.ar-handoff{grid-column:1 / -1; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.ar-handoff button{padding:14px 26px; background:var(--spo2); color:#04151E; border-radius:2px;
  font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase}
.ar-handoff p{margin:0; font-size:11.5px; color:var(--dim); flex:1; min-width:200px; line-height:1.5}

/* ---- record body ---- */
.ar-body{display:flex; flex:1; min-height:0}
.ar-chart{flex:1; overflow:auto; -webkit-overflow-scrolling:touch}
.ar-inner{min-width:min-content; padding-bottom:24px}
.ar-toolbar{display:flex; align-items:center; gap:12px; padding:10px 12px 4px; position:sticky; left:0}
.ar-toolk{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
.ar-emerg{display:flex; flex-wrap:wrap; gap:6px; padding:2px 12px 8px; position:sticky; left:0; max-width:1100px}
.ar-em{border:1px solid var(--line-hi); border-left:2px solid var(--crit); border-radius:2px;
  padding:6px 10px; min-width:126px}
.ar-em .n{font-size:10.5px; color:var(--muted); letter-spacing:.02em}
.ar-em .d{font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--ink); margin:1px 0}
.ar-em .m{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--co2); margin-bottom:2px}
.ar-em .r{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--dim)}
.ar-em .c{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--warn); margin-top:1px}
.ar-em .rp{font-size:9px; color:var(--muted); margin-top:2px; line-height:1.3}
.ar-em{max-width:170px}
.ar-toolbar.mon{align-items:flex-start; padding-top:4px}
.ar-toolbar.mon .ar-toolk{padding-top:9px}
.ar-ivwrap{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; max-width:940px}
.ar-inline{display:flex; align-items:center; gap:7px; padding:0 10px; height:34px;
  border:1px solid var(--line-hi); border-radius:2px; font-size:12px; color:var(--muted)}
.ar-inline .ar-szin.sm{width:46px; height:24px; text-align:center; border:1px solid var(--line-hi);
  border-radius:2px; background:var(--panel2); color:var(--ink); padding:0;
  font-family:'IBM Plex Mono',monospace; font-size:13px}
.ar-pair{display:flex; align-items:center; gap:0}
.ar-pair .ar-check{border-top-right-radius:0; border-bottom-right-radius:0; border-right:none}
.ar-pair .ar-szin.fill{width:260px; font-family:'IBM Plex Sans Condensed',sans-serif}
.ar-pair .ar-hsel.sz,.ar-pair .ar-szin{width:78px; height:34px; border-radius:0 2px 2px 0;
  border:1px solid var(--line-hi); background:var(--panel2); color:var(--ink); padding:0 8px;
  font-family:'IBM Plex Mono',monospace; font-size:13px}
.ar-ivf{display:flex; flex-direction:column; gap:3px}
.ar-ivf label{white-space:nowrap}
.ar-ivf label{font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim)}
.ar-ivf input{width:74px; height:34px; background:var(--panel2); border:1px solid var(--line-hi);
  border-radius:2px; color:var(--ink); padding:0 8px; font-family:'IBM Plex Mono',monospace; font-size:13px}
.ar-ivf.wide input{width:260px; font-family:'IBM Plex Sans Condensed',sans-serif}
.ar-ivf .ar-hsel{height:34px; width:74px}
.ar-ivf .ar-hsel.sc{width:100%; min-width:240px; max-width:300px}
.ar-ivf .ar-ro.sc{height:34px; display:flex; align-items:center; padding:0 10px; min-width:86px}
.ar-divider{width:1px; align-self:stretch; background:var(--line-hi); margin:0 4px}
.ar-check.sz{padding:8px 10px}
.ar-monset{display:flex; flex-wrap:wrap; gap:6px; max-width:940px}
.ar-monother{background:var(--panel2); border:1px solid var(--line-hi); border-radius:2px; color:var(--ink);
  font-family:'IBM Plex Sans Condensed',sans-serif; font-size:12px; padding:8px 12px; width:150px}
.ar-monother::placeholder{color:var(--dim)}
.ar-seg{display:flex; border:1px solid var(--line-hi); border-radius:2px; overflow:hidden}
.ar-segbtn{padding:8px 16px; font-size:12px; letter-spacing:.04em; color:var(--muted); background:var(--panel2);
  border-right:1px solid var(--line-hi)}
.ar-segbtn:last-child{border-right:none}
.ar-segbtn.on{background:var(--spo2); color:#04151E; font-weight:700}
.ar-sechead{display:flex; align-items:center; gap:8px; padding:9px 12px 6px; position:sticky; left:0;
  font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
.ar-sechead::after{content:''; flex:1; height:1px; background:var(--line)}
.ar-note{text-transform:none; letter-spacing:.02em; color:var(--dim); font-size:10px; opacity:.85}
.ar-graphwrap{position:relative}
.ar-yaxis{position:absolute; left:0; top:0; bottom:0; background:var(--field);
  border-right:1px solid var(--line-hi); z-index:2}
.ar-ytick{position:absolute; right:6px; transform:translateY(-50%); font-size:10px; color:var(--dim);
  font-family:'IBM Plex Mono',monospace}
.ar-row{display:grid; align-items:stretch; border-bottom:1px solid var(--line)}
.ar-lab{position:sticky; left:0; z-index:2; background:var(--field); border-right:1px solid var(--line-hi);
  padding:0 10px; display:flex; align-items:center; justify-content:space-between; gap:6px;
  font-size:11.5px; min-height:30px}
.ar-lab.blocked{border-left:2px solid var(--crit)}
.ar-lab.blocked>span:first-child{color:var(--crit); text-decoration:line-through}
.ar-lab .u{font-size:9px; color:var(--dim); letter-spacing:.08em}
.ar-cell{border-right:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; min-height:30px}
.ar-cell.q{border-right-color:var(--line-hi)}
.ar-cell.now{background:rgba(86,199,242,.07)}
.ar-cell.sel{background:rgba(86,199,242,.16); box-shadow:inset 0 0 0 1px var(--spo2)}
.ar-cell button{width:100%; height:100%; font-family:'IBM Plex Mono',monospace; font-size:12.5px}
.ar-cell .empty{color:#2C3742; font-size:15px}
.ar-times .ar-cell{font-size:10.5px; color:var(--muted); min-height:26px}
.ar-times .ar-cell.q{color:var(--ink)}
.ar-dose{color:var(--co2)}
.ar-sub{position:sticky; z-index:2; background:var(--field); border-right:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; min-height:30px;
  font-family:'IBM Plex Mono',monospace; font-size:12px}
.ar-sub.b{border-right:1px solid var(--line-hi)}
.ar-sub.tot{color:var(--co2)}
.ar-sub button{width:100%; height:100%; font-family:'IBM Plex Mono',monospace; font-size:12px}
.ar-subhead{font-family:'IBM Plex Sans Condensed',sans-serif; font-size:9px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim)}
.ar-cellin{width:100%; height:100%; background:var(--panel2); border:none; text-align:center;
  color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:0}
.ar-labin{width:100%; background:transparent; border:none; border-bottom:1px dashed var(--line-hi);
  color:var(--ink); font-family:'IBM Plex Sans Condensed',sans-serif; font-size:11.5px; padding:2px 0}
.ar-labin::placeholder{color:var(--dim)}
.ar-addrow{position:sticky; left:0; margin:6px 12px 2px; padding:7px 12px; border:1px dashed var(--line-hi);
  border-radius:2px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.ar-evtdot{width:7px; height:7px; border-radius:50%; background:var(--evt)}
.ar-blockbar{position:sticky; left:0; margin:8px 12px; padding:10px 12px; background:var(--crit); color:#fff;
  border-radius:2px; font-size:12px; font-weight:600; display:flex; gap:10px; align-items:center}
.ar-blockbar button{margin-left:auto; border:1px solid rgba(255,255,255,.5); padding:5px 10px; border-radius:2px; font-size:11px}

/* ---- entry pad ---- */
.ar-pad{width:296px; flex-shrink:0; border-left:1px solid var(--line-hi); background:var(--panel);
  display:flex; flex-direction:column; overflow-y:auto}
.ar-padhead{padding:12px 14px; border-bottom:1px solid var(--line)}
.ar-padhead .t{font-family:'IBM Plex Mono',monospace; font-size:22px; line-height:1}
.ar-padhead .s{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:4px}
.ar-carry{margin:10px 14px 4px; padding:11px; border-radius:2px; background:var(--hr); color:#04150C;
  font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; width:calc(100% - 28px)}
.ar-carry[disabled]{background:var(--panel2); color:var(--dim); cursor:not-allowed}
.ar-hint{padding:4px 14px 10px; font-size:10.5px; color:var(--dim); line-height:1.45}
.ar-in{display:flex; align-items:center; gap:8px; padding:6px 14px}
.ar-in label{flex:1; font-size:11.5px}
.ar-in label b{display:block; font-size:9px; color:var(--dim); letter-spacing:.1em; font-weight:400}
.ar-in .base{color:var(--dim); font-family:'IBM Plex Mono',monospace}
.ar-step{display:flex; align-items:center; border:1px solid var(--line-hi); border-radius:2px; overflow:hidden}
.ar-step button{width:30px; height:32px; font-size:16px; color:var(--muted); background:var(--panel2)}
.ar-step button:active{background:var(--line-hi); color:var(--ink)}
.ar-step input{width:52px; height:32px; text-align:center; background:transparent; border:none; color:var(--ink);
  font-family:'IBM Plex Mono',monospace; font-size:14px}
.ar-step.carried input{color:var(--muted); font-style:italic}
.ar-selin{width:114px; height:32px; background:var(--panel2); border:1px solid var(--line-hi); border-radius:2px;
  color:var(--ink); font-family:'IBM Plex Sans Condensed',sans-serif; font-size:13px; padding:0 6px}
.ar-selin.carried{color:var(--muted); font-style:italic}
.ar-padfoot{margin-top:auto; padding:12px 14px; border-top:1px solid var(--line); display:flex; gap:8px}
.ar-padfoot button{flex:1; padding:11px; border-radius:2px; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; font-weight:600}
.ar-save{background:var(--spo2); color:#04151E}
.ar-clear{border:1px solid var(--line-hi); color:var(--muted)}
.ar-evtlist{padding:2px 14px 10px}
.ar-evtbtn{display:block; width:100%; text-align:left; padding:8px 10px; margin-bottom:5px; border-radius:2px;
  background:var(--panel2); font-size:12px; border-left:2px solid var(--evt)}
.ar-evtbtn.on{background:var(--evt); color:#150A22; font-weight:600}
.ar-evtt{color:var(--evt); padding:2px 6px; margin-left:-6px; border-radius:2px;
  border-bottom:1px dashed rgba(200,155,240,.5)}
.ar-evtt:active{background:var(--panel2)}
.ar-evtin{width:74px; background:var(--panel2); border:1px solid var(--evt); border-radius:2px;
  color:var(--ink); padding:2px 6px; font-family:'IBM Plex Mono',monospace; font-size:12px}

/* ---- summary ---- */
.ar-sum{display:flex; border-top:1px solid var(--line-hi); background:var(--panel); flex-wrap:wrap}
.ar-sumi{padding:8px 16px; border-right:1px solid var(--line); min-width:104px}
.ar-sumi .k{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}

// Deterministic per-column jitter. SALT (a per-case number) shifts the entire
// pattern, so two cases with identical inputs still generate different traces,
// while a single case stays stable across re-renders.
const wobbleS = (salt, seed, amp) => {
  const x = Math.sin((seed + salt * 0.6180339887) * 127.1) * 43758.5453;
  return (x - Math.floor(x) - 0.5) * 2 * amp;
};

// A deterministic value in [lo, hi] for a given seed, also salted per case.
const spreadS = (salt, seed, lo, hi) => lo + (wobbleS(salt, seed, 0.5) + 0.5) * (hi - lo);

// Offset from baseline at column i of n: a small dip over the first two
// intervals, a steady climb back to baseline by the 30-minute mark, then
// baseline with slight variation for the rest of the case.
// EtCO₂ run from an anchor value: a bounded rise (never more than 5 above the
// anchor), then a slow decline landing within a point of the anchor at the end.
const etco2Curve = (salt, v0, len) => {
  const rise = spreadS(salt, 53, 3, 5);
  const peak = Math.max(1, Math.round(len * 0.3));
  const out = [];
  for (let j = 1; j <= len; j++) {
    let v;
    if (j === len) v = v0 + wobbleS(salt, 59, 1);
    else if (j <= peak) v = v0 + rise * (j / peak) + wobbleS(salt, j * 19 + 7, 0.7);
    else v = v0 + rise * (1 - (j - peak) / (len - peak)) + wobbleS(salt, j * 19 + 7, 0.7);
    out.push(Math.round(Math.min(v0 + 5, v)));
  }
  return out;
};

const dipDelta = (i, n, drop, backAt = 6) => {
  if (i === 0 || n <= 0) return 0;
  const back = Math.min(backAt, n);      // column where baseline is regained
  if (i === 1) return -drop;
  if (i >= back) return 0;
  if (i === 2 || back <= 3) return -drop * 0.95;
  return -drop * 0.95 * (1 - (i - 2) / (back - 2));
};

// Strip only what a filesystem rejects — commas and spaces are kept.
const fileSafe = (x) => (x || "").replace(/[\/\\:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim();

// Surname only, for the provider: last word of the name.
const provLast = (full) => {
  const t = fileSafe(full);
  if (!t) return "";
  return t.includes(",") ? t.split(",")[0].trim() : t.split(" ").pop();
};

// Patient as "Last, First" whichever way the name was typed.
const patientLF = (full) => {
  const t = fileSafe(full);
  if (!t) return "patient";
  if (t.includes(",")) {
    const [l, r] = t.split(",");
    return r && r.trim() ? `${l.trim()}, ${r.trim()}` : l.trim();
  }
  const parts = t.split(" ");
  if (parts.length === 1) return parts[0];
  const last = parts.pop();
  return `${last}, ${parts.join(" ")}`;
};

// 2026_08_29 Huson Johnson, Bill
const caseStem = (P) => {
  const d = (P.date || new Date().toISOString().slice(0, 10)).replace(/-/g, "_");
  return [d, provLast(P.anesthesiologist), patientLF(P.name)].filter(Boolean).join(" ");
};

const round = (n) => (n >= 10 ? Math.round(n) : Math.round(n * 10) / 10);
const clock = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const num = (x) => (x === "" || x == null ? null : Number(x));

// "HH:MM" -> minutes past midnight
const toMin = (s) => {
  if (!s || !/^\d{1,2}:\d{2}$/.test(s)) return null;
  const [h, m] = s.split(":").map(Number);
  return h * 60 + m;
};
// minutes past midnight -> "HH:MM", wrapping past midnight
const toHHMM = (m) => {
  const x = ((m % 1440) + 1440) % 1440;
  return `${String(Math.floor(x / 60)).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`;
};
// elapsed between two clock times, tolerating a case that crosses midnight
const span2 = (a, b) => {
  const s = toMin(a), e = toMin(b);
  if (s == null || e == null) return null;
  return e >= s ? e - s : e + 1440 - s;
};
const dur = (m) => (m == null ? null : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`);
const nowHHMM = () => { const d = new Date(); return toHHMM(d.getHours() * 60 + d.getMinutes()); };

// age in whole months from an ISO date string
const ageMonths = (dob) => {
  if (!dob) return null;
  const b = new Date(dob + "T00:00:00"), n = new Date();
  if (isNaN(b)) return null;
  let m = (n.getFullYear() - b.getFullYear()) * 12 + (n.getMonth() - b.getMonth());
  if (n.getDate() < b.getDate()) m -= 1;
  return m < 0 ? null : m;
};
const fmtAge = (m) => {
  if (m == null) return null;
  if (m < 24) return `${m} mo`;
  const y = Math.floor(m / 12), r = m % 12;
  return r ? `${y} y ${r} mo` : `${y} y`;
};
// "104/62" -> { sbp, dbp }
const parseBP = (s) => {
  const m = /^(\d{2,3})\s*\/\s*(\d{2,3})$/.exec((s || "").trim());
  return m ? { sbp: +m[1], dbp: +m[2] } : { sbp: null, dbp: null };
};
const bmiOf = (kg, inches) => {
  const m = (parseFloat(inches) || 0) * 0.0254;
  return kg > 0 && m > 0 ? Math.round((kg / (m * m)) * 10) / 10 : null;
};

/* ---------------- component ---------------- */

function AnesthesiaRecord() {
  const [view, setView] = useState("preop");
  const [hdrOpen, setHdrOpen] = useState(true);
  const [printView, setPrintView] = useState(false);
  const [preop, setPreop] = useState({
    // identity & billing
    name: "", dob: "", idNum: "", plan: "", authNum: "",
    date: new Date().toISOString().slice(0, 10),
    // case times (manual entry)
    anesStart: "", anesEnd: "", surgStart: "", surgEnd: "",
    sex: "", kg: "", asa: "I",
    // preop vitals & evaluation
    heightIn: "", mp: "1", bp: "", baseHr: "", baseSpo2: "", baseRr: "", baseTemp: "",
    ecg: "NSR", cvRRR: true, lungs: "CTAB",
    pmh: "", meds: "", notes: "",
    anesType: "GA / DS",
    monitors: Object.fromEntries(MONITORS.map((m) => [m, true])),
    ivSite: "Foot", ivSide: "Right", ivSize: "22", ivAttempts: "1", ivNotes: "",
    airway: { "22 F": true, R: true, NETT: true },
    nettSize: "", oettSize: "", airwayNotes: "",
    technique: Object.fromEntries(TECHNIQUE_ON.map((m) => [m, true])),
    intub: Object.fromEntries(INTUB_ON.map((m) => [m, true])),
    intubAttempts: "1", intubGrade: "1", kvSize: "3",
    procs: { "Op-dent": true }, procOther: false, procOtherText: "",
    extub: Object.fromEntries(EXTUB_ON.map((m) => [m, true])),
    emerg: Object.fromEntries(EMERG_ITEMS.map((m) => [m, true])),
    uneventful: true, comments: "",
    disch: Object.fromEntries(DISCH_ITEMS.map((m) => [m, true])),
    dischWith: true, dischWithText: "",
    surgeon: "", assistants: "", anesthesiologist: "Timothy O. Huson",
    aldrete: Object.fromEntries(ALDRETE.map((r) => [r.k, "2"])),
    nkda: true, allergies: "",
    npoSolids: "", npoClears: "",
    proc: "Full-mouth dental rehabilitation", estMin: "60",
    airwayPlan: "Nasal ETT",
    flags: {},
  });

  const [tick, setTick] = useState(Date.now());
  // first 5-minute column starts pre-filled; every value stays editable
  const [vitals, setVitals] = useState({ 0: { spo2: 99, ecg: "NSR", temp: "√" } });
  const [doses, setDoses] = useState({
    0: { o2: 2, ns: "--", n2o: "2x", sevo: "8x", pro: 50, fen: 10, clo: 10, ond: 1 },
  });
  const [events, setEvents] = useState({});
  const [sel, setSel] = useState(null);
  const [draft, setDraft] = useState(null);
  const [carried, setCarried] = useState({});
  const [blockWarn, setBlockWarn] = useState(null);
  const [drag, setDrag] = useState(null);          // { t, key } point being dragged
  const [selPt, setSelPt] = useState(null);        // { t, key } point showing its value
  const [evtEdit, setEvtEdit] = useState(null);    // event group whose time is being edited
  const pressTimer = useRef(null);                 // long-press arming for graph dragging
  const pressRef = useRef(null);
  const fileRef = useRef(null);                    // hidden picker for Load case
  const [ioMsg, setIoMsg] = useState(null);
  const [signedAt, setSignedAt] = useState(null);  // ISO timestamp once signed
  const [loaded, setLoaded] = useState(null);      // { file, savedAt } of the case in hand
  const [confirmedOverwrite, setConfirmedOverwrite] = useState(false);
  // Per-case salt: fixed for the life of this record, different every new one.
  // Makes each document's generated BP/HR/EtCO₂ trace unique.
  const salt = useRef(Math.floor(Math.random() * 1e6)).current;
  const [edit, setEdit] = useState(null);            // { id, t } cell being typed into
  const [waste, setWaste] = useState({});          // { rowId: amount }
  const [totals, setTotals] = useState({});        // typed totals, for rows that aren't summed
  const [extras, setExtras] = useState([{ id: "x1", name: "" }, { id: "x2", name: "" }]);

  useEffect(() => {
    const id = setInterval(() => setTick(Date.now()), 15000);
    return () => clearInterval(id);
  }, []);

  const P = (k, v) => setPreop((p) => ({ ...p, [k]: v }));

  // Anesthesia times drive the surgical times: start +15, end −15. Both stay editable.
  const setAnesStart = (x) => setPreop((p) => ({
    ...p, anesStart: x,
    surgStart: toMin(x) != null ? toHHMM(toMin(x) + 15) : p.surgStart,
  }));
  const setAnesEnd = (x) => setPreop((p) => ({
    ...p, anesEnd: x,
    surgEnd: toMin(x) != null ? toHHMM(toMin(x) - 15) : p.surgEnd,
  }));
  const kg = parseFloat(preop.kg) || 0;
  const months = ageMonths(preop.dob);
  const baseBP = parseBP(preop.bp);
  const bmi = bmiOf(kg, preop.heightIn);

  /* --- derived defaults --- */

  const activeFlags = FLAGS.filter((f) => preop.flags[f.id]);
  const allergyList = preop.nkda ? [] :
    preop.allergies.split(/[,;\n]/).map((s) => s.trim()).filter(Boolean);
  const isBlocked = (drug) =>
    allergyList.some((a) => a.length > 2 && drug.name.toLowerCase().includes(a.toLowerCase()));

  const milestones = AIRWAYS[preop.airwayPlan] || AIRWAYS["Nasal ETT"];

  const aldreteTotal = ALDRETE.reduce((a, r) => a + (Number(preop.aldrete[r.k]) || 0), 0);

  /* --- case times --- */
  const anesTotal = span2(preop.anesStart, preop.anesEnd);
  const surgTotal = span2(preop.surgStart, preop.surgEnd);
  const running = !!preop.anesStart && !preop.anesEnd;
  const liveElapsed = running ? span2(preop.anesStart, toHHMM(new Date(tick).getHours() * 60 + new Date(tick).getMinutes())) : null;

  // last 5-minute column covered by the case
  const lastCol = anesTotal != null ? Math.floor(anesTotal / 5) * 5 : null;

  // earliest charted EtCO₂ — the anchor the generated run grows from
  const eAnchor = (() => {
    for (let t = 0; lastCol != null && t <= lastCol; t += 5) {
      const v = vitals[t]?.etco2;
      if (v != null && v !== "") return { t, v: Number(v) };
    }
    return null;
  })();

  // Fill the routine rows across the whole case once the end time is known.
  // Only empty cells are filled, so anything typed by hand survives — except O₂,
  // whose last-column value has to move when the end time changes.
  useEffect(() => {
    if (lastCol == null) return;
    const ts = [];
    for (let t = 0; t <= lastCol; t += 5) ts.push(t);

    setDoses((prev) => {
      const next = { ...prev };
      ts.forEach((t) => {
        const col = { ...(next[t] || {}) };
        // 3 L/min over the final 15 minutes (last three columns)
        col.o2 = (lastCol > 0 && t > lastCol - 15) ? 3 : 2;
        if (col.ns == null) col.ns = t === 0 ? "--" : "---";
        // agent typed at the second unit, end time entered later: complete the run
        ["sevo", "iso"].forEach((ag) => {
          const v = (prev[5] || {})[ag];
          if (v == null || v === "" || t <= 5 || lastCol < 15) return;
          if (col[ag] != null) return;                     // never clobber a filled cell
          if (t === lastCol - 5) col[ag] = `${String(v).replace(/x$/, "")}x`;
          else if (t < lastCol - 5) col[ag] = v;
        });
        next[t] = col;
      });
      return next;
    });

    setVitals((prev) => {
      // Baseline comes from the FIRST CHARTED READING when the user has set one
      // (typed or dragged), falling back to the preop vitals, then to defaults.
      // The whole generated trend rebases whenever that first reading changes.
      const t0 = prev[0] || {};
      const t0real = !t0.auto;
      const b = {
        sbp: (t0real ? t0.sbp : null) ?? baseBP.sbp ?? 100,
        dbp: (t0real ? t0.dbp : null) ?? baseBP.dbp ?? 60,
        hr: (t0real ? t0.hr : null) ?? num(preop.baseHr) ?? 100,
      };
      const n = ts.length - 1;
      const dropS = spreadS(salt, 11, 5, 10);     // systolic dip, 5–10 points
      const dropD = spreadS(salt, 12, 5, 10);     // diastolic dip, 5–10 points
      const dropH = spreadS(salt, 13, 4, 8);      // heart rate dip, a few beats only

      // Heart rate: dip a few beats over the first 1–2 intervals, then climb back
      // in uneven, randomly-sized steps, landing on the starting rate at the end.
      const dipFloor = b.hr - dropH;
      const hrSeq = [Math.round(b.hr)];
      if (n >= 1) {
        if (n <= 2) {
          hrSeq.push(Math.round(dipFloor + wobbleS(salt, 31, 1.2)));
          if (n === 2) hrSeq.push(Math.round(b.hr + wobbleS(salt, 41, 1)));
        } else {
          hrSeq.push(Math.round(dipFloor + wobbleS(salt, 31, 1.2)));     // unit 2: the dip
          hrSeq.push(Math.round(dipFloor + wobbleS(salt, 37, 1.4)));     // unit 3: still low
          const steps = n - 2;
          const w = [];
          for (let k = 1; k <= steps; k++) w.push(0.15 + (wobbleS(salt, k * 29 + 2, 0.5) + 0.5));
          const wSum = w.reduce((a, c) => a + c, 0);
          let cum = 0;
          for (let i = 3; i <= n; i++) {
            cum += w[i - 3];
            const v = i === n
              ? b.hr + wobbleS(salt, 41, 1)
              : dipFloor + (cum / wSum) * (b.hr - dipFloor) + wobbleS(salt, i * 13 + 5, 1.2);
            hrSeq.push(Math.round(v));
          }
        }
      }
      const baseRR = num(preop.baseRr) ?? 18;

      const eSeq = (eAnchor && !isNaN(eAnchor.v) && lastCol > eAnchor.t)
        ? etco2Curve(salt, eAnchor.v, (lastCol - eAnchor.t) / 5)
        : null;

      const next = { ...prev };
      ts.forEach((t, i) => {
        const row = { ...(next[t] || {}) };
        if (row.spo2 == null) row.spo2 = t === 0 ? 99 : 100;
        // EtCO₂ runs forward from the first entered value; typed cells win
        if (eSeq && t > eAnchor.t && (row.etco2 == null || row.etco2 === ""))
          row.etco2 = eSeq[(t - eAnchor.t) / 5 - 1];
        // respiratory rate varies on its own — no relationship to the pressure trend
        if (row.rr == null) row.rr = Math.max(6, Math.round(baseRR + wobbleS(salt, i * 7 + 5, 2.2)));
        if (row.ecg == null) row.ecg = "NSR";
        if (row.temp == null) row.temp = "√";

        // generate into empty columns, and REgenerate columns still marked auto —
        // rows the user has touched (auto cleared) are never overwritten
        const empty = row.sbp == null && row.dbp == null && row.hr == null;
        if (empty || row.auto) {
          row.sbp = Math.round(b.sbp + dipDelta(i, n, dropS) + wobbleS(salt, i * 3 + 1, 3));
          row.dbp = Math.round(b.dbp + dipDelta(i, n, dropD) + wobbleS(salt, i * 3 + 2, 3));
          row.hr = hrSeq[i] ?? Math.round(b.hr);
          if (row.dbp >= row.sbp - 8) row.dbp = row.sbp - 8;
          row.auto = true;          // cleared when the interval is saved or dragged
        }
        next[t] = row;
      });
      return next;
    });
  }, [lastCol, baseBP.sbp, baseBP.dbp, preop.baseHr, preop.baseRr,
      vitals[0]?.sbp, vitals[0]?.dbp, vitals[0]?.hr, vitals[0]?.auto,
      eAnchor?.t, eAnchor?.v]);

  /* --- timeline --- */
  const elapsed = anesTotal ?? liveElapsed ?? 0;
  const nowCol = Math.floor(elapsed / 5) * 5;
  const est = parseInt(preop.estMin) || 60;
  const span = lastCol != null
    ? lastCol
    : Math.max(60, est + 15, (Math.floor(elapsed / 5) + 3) * 5);
  const cols = useMemo(() => {
    const a = []; for (let t = 0; t <= span; t += 5) a.push(t); return a;
  }, [span]);
  const grid = { gridTemplateColumns: `${GUT}px ${SUB}px ${SUB}px repeat(${cols.length}, ${COL}px)` };

  /* --- carryover handoff --- */
  /* --- save / load the whole case as JSON --- */
  const saveCase = () => {
    // If the file on disk has been re-saved since we loaded it, someone else may
    // have edited it — confirm before writing over their work.
    if (loaded?.savedAt && !confirmedOverwrite) {
      const picked = window.confirm(
        `This case was loaded from ${loaded.file}\n` +
        `(saved ${new Date(loaded.savedAt).toLocaleString()}).\n\n` +
        `Saving writes a fresh copy — if anyone changed that file since you opened it, ` +
        `their edits are not in this version.\n\nSave anyway?`
      );
      if (!picked) return;
      setConfirmedOverwrite(true);
    }
    const payload = {
      app: "anesthesia-record", version: 1, savedAt: new Date().toISOString(),
      preop, vitals, doses, waste, totals, extras, events, signedAt,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${caseStem(preop)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  };

  const loadCase = (file) => {
    if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (!d || d.app !== "anesthesia-record") throw new Error("wrong file");
        // merge preop over the defaults so saves from older versions stay loadable
        if (d.preop) setPreop((p) => ({ ...p, ...d.preop }));
        setVitals(d.vitals || {});
        setDoses(d.doses || {});
        setWaste(d.waste || {});
        setTotals(d.totals || {});
        setExtras(d.extras?.length ? d.extras : [{ id: "x1", name: "" }, { id: "x2", name: "" }]);
        setEvents(d.events || {});
        setSignedAt(d.signedAt || null);
        setLoaded({ file: file.name, savedAt: d.savedAt || null });
        setConfirmedOverwrite(false);
        setSel(null); setDraft(null); setEdit(null);
        setIoMsg(`Loaded case saved ${new Date(d.savedAt).toLocaleString()}`);
      } catch {
        setIoMsg("Couldn't read that file — it doesn't look like a saved case.");
        setLoaded(null);
      }
      setTimeout(() => setIoMsg(null), 6000);
    };
    rd.readAsText(file);
  };

  const carryToRecord = () => {
    const t0 = {};
    if (baseBP.sbp) t0.sbp = baseBP.sbp;
    if (baseBP.dbp) t0.dbp = baseBP.dbp;
    if (num(preop.baseHr)) t0.hr = num(preop.baseHr);
    NUMROWS.forEach((r) => {
      const raw = r.base ? preop[r.base] : "";
      const v = r.opts ? raw : num(raw);
      t0[r.id] = (v === "" || v == null || Number.isNaN(v)) ? r.def : v;
    });
    setVitals((v) => ({ ...v, 0: t0 }));

    setEvents((e) => ({ ...e, 0: [...new Set([...(e[0] || []), "Anesthesia start"])] }));

    if (!preop.anesStart) setAnesStart(nowHHMM());
    setTick(Date.now());
    setView("record");
    openCol(0, { ...vitals, 0: t0 });
  };

  /* --- interval autofill --- */
  const priorOf = (t, src = vitals) => {
    const before = Object.keys(src).map(Number).filter((x) => x < t).sort((a, b) => b - a);
    return before.length ? src[before[0]] : null;
  };

  const openCol = (t, src = vitals) => {
    setSel(t);
    if (src[t]) { setDraft({ ...src[t] }); setCarried({}); return; }
    const prior = priorOf(t, src);
    if (prior) {
      setDraft({ ...prior });
      setCarried(Object.fromEntries(Object.keys(prior).map((k) => [k, true])));
    } else {
      setDraft({
        sbp: baseBP.sbp ?? 100,
        dbp: baseBP.dbp ?? 60,
        hr: num(preop.baseHr) ?? 100,
        ...Object.fromEntries(NUMROWS.map((r) => {
          const raw = r.base ? preop[r.base] : "";
          return [r.id, (r.opts ? raw : num(raw)) || r.def];
        })),
      });
      setCarried({});
    }
  };

  const setField = (k, v) => {
    setDraft((d) => ({ ...d, [k]: v }));
    setCarried((c) => ({ ...c, [k]: false }));
  };
  const commit = () => {
    if (sel === null || !draft) return;
    const row = { ...draft };
    delete row.auto;
    NUMROWS.forEach((r) => { if (r.opts && !row[r.id]) row[r.id] = r.def; });
    setVitals((v) => ({ ...v, [sel]: row }));
    setCarried({});
  };
  const carryForward = () => {
    const prior = priorOf(sel); if (!prior) return;
    setVitals((v) => ({ ...v, [sel]: { ...prior } })); setDraft({ ...prior }); setCarried({});
  };
  const clearCol = () => {
    setVitals((v) => { const n = { ...v }; delete n[sel]; return n; });
    setDraft(null); setSel(null);
  };

  const autoDose = (d) => round(Math.min(kg * d.perKg, d.cap ?? Infinity));

  // perKg rows: first tap stamps the calculated dose, a second tap opens it for editing.
  // Everything else opens straight to a typed entry.
  // dragging a marker writes straight to that interval
  const setPoint = (t, key, raw) => {
    const [lo, hi] = PT_LIMITS[key];
    const v = Math.max(lo, Math.min(hi, Math.round(raw)));
    setVitals((prev) => {
      const row = { ...(prev[t] || {}), [key]: v };
      delete row.auto;
      return { ...prev, [t]: row };
    });
  };

  // BP cell accepts "112/64"; blank clears the pair. HR is a plain number.
  const writeBpCell = (t, raw) => {
    const v = raw.trim();
    setVitals((prev) => {
      const row = { ...(prev[t] || {}) };
      if (v === "") { delete row.sbp; delete row.dbp; delete row.auto; }
      else {
        const bp = parseBP(v);
        if (!bp.sbp) return prev;            // unparseable — leave as it was
        row.sbp = bp.sbp; row.dbp = bp.dbp; delete row.auto;
      }
      return { ...prev, [t]: row };
    });
    setEdit(null);
  };

  const writeVitalCell = (id, t, raw) => {
    const v = raw.trim();
    setVitals((prev) => {
      const row = { ...(prev[t] || {}) };
      if (v === "") delete row[id];
      else row[id] = isNaN(Number(v)) ? v : Number(v);
      return { ...prev, [t]: row };
    });
    setEdit(null);
  };

  const writeHrCell = (t, raw) => {
    const v = raw.trim();
    setVitals((prev) => {
      const row = { ...(prev[t] || {}) };
      if (v === "") { delete row.hr; delete row.auto; }
      else if (!isNaN(Number(v))) { row.hr = Number(v); delete row.auto; }
      else return prev;
      return { ...prev, [t]: row };
    });
    setEdit(null);
  };

  const tapCell = (d, t) => {
    if (isBlocked(d) && !(blockWarn && blockWarn.id === d.id && blockWarn.t === t)) {
      setBlockWarn({ id: d.id, t, name: d.name }); return;
    }
    setBlockWarn(null);
    const filled = doses[t]?.[d.id] != null;
    if (d.perKg && !filled && kg > 0) {
      setDoses((x) => ({ ...x, [t]: { ...(x[t] || {}), [d.id]: autoDose(d) } }));
      return;
    }
    setEdit({ id: d.id, t });
  };

  // total given for a row, summed across every charted interval
  const totalOf = (id) => Object.entries(doses)
    .filter(([t]) => lastCol == null || Number(t) <= lastCol)
    .reduce((a, [, col]) => a + (typeof col?.[id] === "number" ? col[id] : 0), 0);

  const writeTotal = (id, raw) => {
    const v = raw.trim();
    setTotals((w) => { const n = { ...w }; if (v === "") delete n[id]; else n[id] = v; return n; });
    setEdit(null);
  };

  const writeWaste = (id, raw) => {
    const v = raw.trim();
    setWaste((w) => { const n = { ...w }; if (v === "") delete n[id]; else n[id] = v; return n; });
    setEdit(null);
  };

  const writeCell = (id, t, raw) => {
    const v = raw.trim();
    setDoses((x) => {
      const next = { ...x };
      const col = { ...(next[t] || {}) };
      if (v === "") delete col[id]; else col[id] = isNaN(Number(v)) ? v : Number(v);
      next[t] = col;

      // An agent value entered at the second unit runs for the whole case:
      // the same value through the third-to-last unit, "<value>x" at the
      // second-to-last (agent off), and the final unit left clear.
      if ((id === "sevo" || id === "iso") && t === 5 && v !== "" && lastCol != null && lastCol >= 15) {
        for (let tt = 10; tt <= lastCol; tt += 5) {
          const c = { ...(next[tt] || {}) };
          if (tt === lastCol) delete c[id];
          else if (tt === lastCol - 5) c[id] = `${v}x`;
          else c[id] = isNaN(Number(v)) ? v : Number(v);
          next[tt] = c;
        }
      }
      return next;
    });
    setEdit(null);
  };

  // Reads "08:35" as a clock time (when a start time exists) or "40" as minutes;
  // snaps to the 5-minute grid and merges into whatever is already at that slot.
  const moveEvents = (from, raw) => {
    const v = raw.trim();
    let t2 = null;
    if (/^\d{1,3}$/.test(v)) t2 = Number(v);
    else if (toMin(v) != null && toMin(preop.anesStart) != null) t2 = span2(preop.anesStart, v);
    if (t2 == null || isNaN(t2)) { setEvtEdit(null); return; }
    t2 = Math.max(0, Math.round(t2 / 5) * 5);
    if (lastCol != null) t2 = Math.min(t2, lastCol);
    setEvents((prev) => {
      if (t2 === from) return prev;
      const next = { ...prev };
      const moving = next[from] || [];
      delete next[from];
      next[t2] = [...new Set([...(next[t2] || []), ...moving])];
      return next;
    });
    setEvtEdit(null);
  };

  const evtTimeLabel = (t) =>
    toMin(preop.anesStart) != null ? toHHMM(toMin(preop.anesStart) + t) : `${t} min`;

  const toggleEvent = (label) => {
    if (sel === null) return;
    setEvents((e) => {
      const col = e[sel] || [];
      return { ...e, [sel]: col.includes(label) ? col.filter((x) => x !== label) : [...col, label] };
    });
  };

  /* --- summary --- */
  const rows = Object.entries(vitals).map(([t, v]) => ({ t: +t, ...v })).sort((a, b) => a.t - b.t);
  const stat = (k, fn) => { const xs = rows.map((r) => r[k]).filter((x) => x != null); return xs.length ? fn(...xs) : null; };
  const maps = rows.map((r) => (r.sbp != null && r.dbp != null ? Math.round((r.sbp + 2 * r.dbp) / 3) : null)).filter(Boolean);
  const summary = [
    { k: "Anesthesia time", v: dur(anesTotal ?? liveElapsed) ?? "—" },
    { k: "Surgical time", v: dur(surgTotal) ?? "—" },
    { k: "HR range", v: stat("hr", Math.min) != null ? `${stat("hr", Math.min)}–${stat("hr", Math.max)}` : "—", u: "bpm" },
    { k: "SBP range", v: stat("sbp", Math.min) != null ? `${stat("sbp", Math.min)}–${stat("sbp", Math.max)}` : "—", u: "mmHg" },
    { k: "Lowest MAP", v: maps.length ? Math.min(...maps) : "—", u: "mmHg" },
    { k: "SpO₂ nadir", v: stat("spo2", Math.min) ?? "—", u: "%" },
    { k: "Intervals charted", v: rows.length },
    { k: "Still generated", v: rows.filter((r) => r.auto).length, warn: rows.some((r) => r.auto) },
  ];

  const y = (v) => GH - (v / YMAX) * GH;

  if (printView) {
    return (
      <div className="ar">
        <style>{CSS}</style>
        <PrintSheet preop={preop} vitals={vitals} doses={doses} waste={waste} totals={totals}
          extras={extras} events={events} cols={cols} totalOf={totalOf}
          anesTotal={anesTotal} surgTotal={surgTotal} liveElapsed={liveElapsed}
          aldreteTotal={aldreteTotal} bmi={bmi} months={months}
          allergyList={allergyList} activeFlags={activeFlags}
          signedAt={signedAt} onSign={setSignedAt}
          onBack={() => setPrintView(false)} />
      </div>
    );
  }

  return (
    <div className="ar">
      <style>{CSS}</style>

      <header className="ar-top">
        <div className="ar-brand">
          <h1>Anesthesia Record</h1>
          <p>Office-based · pediatric</p>
        </div>
        <div className="ar-tabs">
          <button className={`ar-tab ${view === "preop" ? "on" : ""}`} onClick={() => setView("preop")}>Preop</button>
          <button className={`ar-tab ${view === "record" ? "on" : ""}`} onClick={() => setView("record")}>Record</button>
        </div>
        <div className="ar-idstrip">
          <Id k="Age" v={fmtAge(months) ?? "—"} />
          <Id k="Weight" v={`${preop.kg} kg`} />
          <Id k="ASA" v={preop.asa} />
        </div>
        {loaded && (
          <div className="ar-loaded" title={`Loaded ${loaded.file}`}>
            <span className="k">Open case</span>
            <span className="v">{loaded.file.replace(/\.json$/i, "")}</span>
          </div>
        )}
        <button className="ar-collapse" onClick={saveCase}>Save case</button>
        <button className="ar-collapse" onClick={() => fileRef.current?.click()}>Load case</button>
        <input ref={fileRef} type="file" accept=".json,application/json" style={{ display: "none" }}
          onChange={(e) => { loadCase(e.target.files?.[0]); e.target.value = ""; }} />
        <button className="ar-collapse" onClick={() => setPrintView(true)}>Print / PDF</button>
        <button className="ar-collapse" onClick={() => setHdrOpen(!hdrOpen)}>
          {hdrOpen ? "Hide header" : "Show header"}
        </button>
      </header>

      {/* ---------- case header ---------- */}
      {hdrOpen && (
        <div className="ar-hdr">
          <div className="ar-hrow">
            <Hf l="Patient name" v={preop.name} on={(x) => P("name", x)} type="text" grow />
            <div className="ar-hf">
              <label>Date of birth</label>
              <DobPicker v={preop.dob} on={(x) => P("dob", x)} />
            </div>
            <Hf l="ID number" v={preop.idNum} on={(x) => P("idNum", x)} type="text" />
            <div className="ar-hf grow">
              <label>Plan</label>
              <select className="ar-hsel" value={preop.plan} data-empty={preop.plan ? "0" : "1"}
                onChange={(e) => P("plan", e.target.value)}>
                <option value="">—</option>
                {PLANS.map((x) => <option key={x} value={x}>{x}</option>)}
              </select>
            </div>
            <Hf l="Authorization number" v={preop.authNum} on={(x) => P("authNum", x)} type="text" />
          </div>

          <div className="ar-hrow">
            <Hf l="Anesthesia start" v={preop.anesStart} on={setAnesStart} type="time" times />
            <Hf l="Anesthesia end" v={preop.anesEnd} on={setAnesEnd} type="time" times />
            <Hf l="Surgery start" v={preop.surgStart} on={(x) => P("surgStart", x)} type="time" />
            <Hf l="Surgery end" v={preop.surgEnd} on={(x) => P("surgEnd", x)} type="time" />
            {running && <button className="ar-go stop" onClick={() => setAnesEnd(nowHHMM())}>End now</button>}
          </div>

          <div className="ar-hrow">
            <div className="ar-hf calc">
              <label>Total anesthesia time</label>
              <div className={`out ${running ? "running" : ""}`}>
                {anesTotal != null
                  ? <>{dur(anesTotal)} <em>{anesTotal} min</em></>
                  : liveElapsed != null
                    ? <>{dur(liveElapsed)} <em>running</em></>
                    : <span style={{ color: "var(--dim)" }}>——</span>}
              </div>
            </div>
            <div className="ar-hf calc">
              <label>Total surgical time</label>
              <div className="out">
                {surgTotal != null
                  ? <>{dur(surgTotal)} <em>{surgTotal} min</em></>
                  : <span style={{ color: "var(--dim)" }}>——</span>}
              </div>
            </div>
            <Hf l="Date of service" v={preop.date} on={(x) => P("date", x)} type="date" />
            <div className="ar-hf tight">
              <label>Billing units (15 min)</label>
              <input readOnly value={anesTotal != null ? Math.ceil(anesTotal / 15) : ""} placeholder="——" />
            </div>
          </div>
        </div>
      )}

      {ioMsg && (
        <div style={{ padding: "7px 16px", fontSize: 12, background: "var(--panel2)",
          borderBottom: "1px solid var(--line-hi)", color: "var(--spo2)" }}>{ioMsg}</div>
      )}

      {/* persistent flag strip — visible in both views */}
      <div className="ar-flagbar">
        {allergyList.length > 0 && (
          <span className="ar-chip crit">Allergy <span className="n">{allergyList.join(" · ")}</span></span>
        )}
        {preop.nkda && <span className="ar-chip info">NKDA</span>}
        {activeFlags.map((f) => (
          <span key={f.id} className={`ar-chip ${f.sev}`}>
            {f.label}{f.note && <span className="n">{f.note}</span>}
          </span>
        ))}
        {!allergyList.length && !activeFlags.length && !preop.nkda &&
          <span className="none">No flags recorded</span>}
      </div>

      {view === "preop" ? (
        <div className="ar-preop">
          <section className="ar-card">
            <h2>Patient</h2>
            <div className="ar-grid2">
              <div className="ar-in2">
                <label>Age — from date of birth</label>
                <div className="ar-ro">{fmtAge(months) ?? "Enter DOB above"}</div>
              </div>
              <In2 l="Gender" v={preop.sex} on={(x) => P("sex", x)} opts={["", "Male", "Female"]} />
              <In2 l="Weight (kg)" v={preop.kg} on={(x) => P("kg", x)} />
              <In2 l="Height (in)" v={preop.heightIn} on={(x) => P("heightIn", x)} />
