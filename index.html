                        editing={edit?.id === `nr-${r.id}` && edit?.t === t}
                        onTap={() => setEdit({ id: `nr-${r.id}`, t })}
                        onWrite={(v) => writeVitalCell(r.id, t, v)}
                        onCancel={() => setEdit(null)} />
                    ) : (
                      <button key={t} className={`ar-cell ${t % 15 === 0 ? "q" : ""} ${t === sel ? "sel" : ""}`}
                        onClick={() => openCol(t)}>
                        {vitals[t]?.[r.id] != null
                          ? <span style={{ color: r.color }}>{vitals[t][r.id]}</span>
                          : <span className="empty">·</span>}
                      </button>
                    ))}
                  </div>
                ))}

                <div className="ar-sechead">Blood pressure &amp; heart rate <span className="ar-note">tap a point to read it · hold, then drag to change · dimmed = generated</span></div>
                <div className="ar-graphwrap">
                  <svg width={LEFT + cols.length * COL} height={GH}
                    style={{ display: "block", touchAction: drag ? "none" : "auto" }}
                    onPointerMove={(e) => {
                      if (drag) {
                        const rect = e.currentTarget.getBoundingClientRect();
                        setPoint(drag.t, drag.key, YMAX * (1 - (e.clientY - rect.top) / GH));
                        return;
                      }
                      // moved before the hold finished — it's a scroll, not a drag
                      if (pressRef.current &&
                          Math.hypot(e.clientX - pressRef.current.x, e.clientY - pressRef.current.y) > 8) {
                        clearTimeout(pressTimer.current);
                        pressRef.current = null;
                      }
                    }}
                    onPointerUp={() => { clearTimeout(pressTimer.current); pressRef.current = null; setDrag(null); }}
                    onPointerLeave={() => { clearTimeout(pressTimer.current); pressRef.current = null; setDrag(null); }}>
                    {[0, 40, 80, 120, 160, 200, 240].map((v) => (
                      <line key={v} x1={LEFT} x2={LEFT + cols.length * COL} y1={y(v)} y2={y(v)} stroke="var(--line)" />
                    ))}
                    {cols.map((t, i) => (
                      <line key={t} x1={LEFT + i * COL + COL / 2} x2={LEFT + i * COL + COL / 2} y1="0" y2={GH}
                        stroke={t % 15 === 0 ? "var(--line-hi)" : "var(--line)"} />
                    ))}
                    {/* baseline reference lines carried from preop */}
                    {[[baseBP.sbp, "var(--bp)"], [baseBP.dbp, "var(--bp)"], [num(preop.baseHr), "var(--hr)"]]
                      .map(([v, c], i) => v ? (
                        <line key={i} x1={LEFT} x2={LEFT + cols.length * COL} y1={y(v)} y2={y(v)}
                          stroke={c} strokeWidth="1" strokeDasharray="3 5" opacity=".38" />
                      ) : null)}
                    {sel !== null && cols.includes(sel) && (
                      <rect x={LEFT + cols.indexOf(sel) * COL} y="0" width={COL} height={GH} fill="rgba(86,199,242,.09)" />
                    )}
                    {/* trend lines */}
                    <polyline fill="none" stroke="var(--hr)" strokeWidth="1.6"
                      points={rows.filter((r) => r.hr != null && cols.includes(r.t))
                        .map((r) => `${LEFT + cols.indexOf(r.t) * COL + COL / 2},${y(r.hr)}`).join(" ")} />

                    {rows.filter((r) => cols.includes(r.t)).map((r) => {
                      const cx = LEFT + cols.indexOf(r.t) * COL + COL / 2;
                      const pts = [
                        r.sbp != null && { key: "sbp", v: r.sbp, c: "var(--bp)" },
                        r.dbp != null && { key: "dbp", v: r.dbp, c: "var(--bp)" },
                        r.hr != null && { key: "hr", v: r.hr, c: "var(--hr)" },
                      ].filter(Boolean);

                      return (
                        <g key={r.t}>
                          {r.sbp != null && r.dbp != null && (
                            <line x1={cx} x2={cx} y1={y(r.sbp)} y2={y(r.dbp)}
                              stroke="var(--bp)" opacity={r.auto ? 0.25 : 0.45} />
                          )}
                          {pts.map((p) => {
                            const py = y(p.v);
                            const active = (drag && drag.t === r.t && drag.key === p.key)
                              || (selPt && selPt.t === r.t && selPt.key === p.key);
                            return (
                              <g key={p.key} opacity={r.auto && !active ? 0.5 : 1}>
                                {p.key === "sbp" && (
                                  <path d={`M${cx - 6},${py - 6} L${cx + 6},${py - 6} L${cx},${py} Z`} fill={p.c} />
                                )}
                                {p.key === "dbp" && (
                                  <path d={`M${cx - 6},${py + 6} L${cx + 6},${py + 6} L${cx},${py} Z`} fill={p.c} />
                                )}
                                {p.key === "hr" && (r.auto
                                  ? <circle cx={cx} cy={py} r="3.4" fill="none" stroke={p.c} strokeWidth="1.4" />
                                  : <circle cx={cx} cy={py} r="3.6" fill={p.c} />)}

                                {/* touch target */}
                                <circle cx={cx} cy={py} r="13" fill="transparent"
                                  style={{ cursor: "ns-resize", touchAction: "none" }}
                                  onPointerDown={(e) => {
                                    e.preventDefault();
                                    const same = selPt && selPt.t === r.t && selPt.key === p.key;
                                    setSelPt(same ? null : { t: r.t, key: p.key });
                                    clearTimeout(pressTimer.current);
                                    pressRef.current = { t: r.t, key: p.key, x: e.clientX, y: e.clientY };
                                    pressTimer.current = setTimeout(() => {
                                      if (pressRef.current) {
                                        setSelPt({ t: r.t, key: p.key });
                                        setDrag({ t: pressRef.current.t, key: pressRef.current.key });
                                      }
                                    }, 350);
                                  }} />

                                {drag && drag.t === r.t && drag.key === p.key && (
                                  <circle cx={cx} cy={py} r="9.5" fill="none"
                                    stroke={p.c} strokeWidth="1.6" opacity="0.75" pointerEvents="none" />
                                )}
                                {active && (
                                  <g pointerEvents="none">
                                    <rect x={cx - 30} y={py - 30} width="60" height="19" rx="2"
                                      fill="var(--panel)" stroke={p.c} strokeWidth="1" />
                                    <text x={cx} y={py - 16.5} textAnchor="middle"
                                      fill="var(--ink)" fontSize="11" fontFamily="IBM Plex Mono, monospace">
                                      {PT_LABEL[p.key]} {p.v}
                                    </text>
                                  </g>
                                )}
                              </g>
                            );
                          })}
                        </g>
                      );
                    })}
                  </svg>
                  <div className="ar-yaxis" style={{ width: LEFT }}>
                    {[40, 80, 120, 160, 200, 240].map((v) => (
                      <span key={v} className="ar-ytick" style={{ top: y(v) }}>{v}</span>
                    ))}
                  </div>
                </div>

                <div className="ar-sechead">Events</div>
                <div className="ar-row" style={grid}>
                  <div className="ar-lab"><span style={{ color: "var(--bp)" }}>BP</span><span className="u">S/D</span></div>
                  <div className="ar-sub a" style={{ left: GUT }} />
                  <div className="ar-sub b" style={{ left: GUT + SUB }} />
                  {cols.map((t) => (
                    <DoseCell key={t} row={{ id: "bprow" }} t={t} q={t % 15 === 0} sel={t === sel}
                      value={vitals[t]?.sbp != null ? `${vitals[t].sbp}/${vitals[t].dbp ?? "—"}` : null}
                      dim={vitals[t]?.auto} mode="text" seed=""
                      editing={edit?.id === "bprow" && edit?.t === t}
                      onTap={() => setEdit({ id: "bprow", t })}
                      onWrite={(v) => writeBpCell(t, v)}
                      onCancel={() => setEdit(null)} />
                  ))}
                </div>
                <div className="ar-row" style={grid}>
                  <div className="ar-lab"><span style={{ color: "var(--hr)" }}>HR</span><span className="u">bpm</span></div>
                  <div className="ar-sub a" style={{ left: GUT }} />
                  <div className="ar-sub b" style={{ left: GUT + SUB }} />
                  {cols.map((t) => (
                    <DoseCell key={t} row={{ id: "hrrow" }} t={t} q={t % 15 === 0} sel={t === sel}
                      value={vitals[t]?.hr ?? null}
                      dim={vitals[t]?.auto} seed=""
                      editing={edit?.id === "hrrow" && edit?.t === t}
                      onTap={() => setEdit({ id: "hrrow", t })}
                      onWrite={(v) => writeHrCell(t, v)}
                      onCancel={() => setEdit(null)} />
                  ))}
                </div>
                <div className="ar-row" style={grid}>
                  <div className="ar-lab"><span>Milestones</span></div>
                  <div className="ar-sub a" style={{ left: GUT }} />
                  <div className="ar-sub b" style={{ left: GUT + SUB }} />
                  {cols.map((t) => (
                    <button key={t} className={`ar-cell ${t % 15 === 0 ? "q" : ""} ${t === sel ? "sel" : ""}`}
                      onClick={() => openCol(t)} title={(events[t] || []).join(", ")}>
                      {events[t]?.length ? <span className="ar-evtdot" /> : <span className="empty">·</span>}
                    </button>
                  ))}
                </div>
                {Object.entries(events).filter(([, v]) => v.length).sort((a, b) => a[0] - b[0]).map(([t, list]) => (
                  <div key={t} style={{ padding: "5px 12px", fontSize: 12, color: "var(--muted)", position: "sticky", left: 0 }}>
                    {evtEdit === +t ? (
                      <input className="ar-evtin" autoFocus defaultValue={evtTimeLabel(+t)}
                        onFocus={(e) => e.target.select()}
                        onBlur={(e) => moveEvents(+t, e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === "Enter") e.target.blur();
                          if (e.key === "Escape") setEvtEdit(null);
                        }} />
                    ) : (
                      <button className="ar-evtt mono" onClick={() => setEvtEdit(+t)}
                        title="Tap to edit this time">{evtTimeLabel(+t)}</button>
                    )}
                    {"  "}{list.join(" · ")}
                  </div>
                ))}
              </div>
            </div>

            <aside className="ar-pad">
              {sel === null ? (
                <div className="ar-hint" style={{ padding: 20, fontSize: 12.5 }}>
                  Tap any time column to chart that interval. Values carry forward from the previous
                  interval automatically — adjust only what changed.
                </div>
              ) : (
                <>
                  <div className="ar-padhead">
                    <div className="t">{clock(sel)}</div>
                    <div className="s">{vitals[sel] ? "Charted" : "New interval"}</div>
                  </div>
                  <button className="ar-carry" onClick={carryForward} disabled={!priorOf(sel)}>
                    Same as last interval
                  </button>
                  <div className="ar-hint">
                    {priorOf(sel) ? "One tap copies the previous interval verbatim."
                      : "No earlier interval to copy yet."}
                  </div>

                  <Step l="Systolic" u="mmHg" v={draft?.sbp} c={carried.sbp} s={2} base={baseBP.sbp} on={(x) => setField("sbp", x)} />
                  <Step l="Diastolic" u="mmHg" v={draft?.dbp} c={carried.dbp} s={2} base={baseBP.dbp} on={(x) => setField("dbp", x)} />
                  <Step l="Heart rate" u="bpm" v={draft?.hr} c={carried.hr} s={2} base={preop.baseHr} on={(x) => setField("hr", x)} />
                  {NUMROWS.map((r) => (r.opts
                    ? <Sel key={r.id} l={r.name} u={r.unit} v={draft?.[r.id]} c={carried[r.id]}
                        opts={r.opts} on={(x) => setField(r.id, x)} />
                    : <Step key={r.id} l={r.name} u={r.unit} v={draft?.[r.id]} c={carried[r.id]} s={r.step}
                        base={r.base ? preop[r.base] : ""} on={(x) => setField(r.id, x)} />
                  ))}

                  <div className="ar-sechead" style={{ position: "static" }}>Mark event</div>
                  <div className="ar-evtlist">
                    {milestones.map((m) => (
                      <button key={m} className={`ar-evtbtn ${(events[sel] || []).includes(m) ? "on" : ""}`}
                        onClick={() => toggleEvent(m)}>{m}</button>
                    ))}
                  </div>

                  <div className="ar-padfoot">
                    <button className="ar-clear" onClick={clearCol}>Clear</button>
                    <button className="ar-save" onClick={commit}>Save interval</button>
                  </div>
                </>
              )}
            </aside>
          </div>

          <div className="ar-sum">
            {summary.map((s) => (
              <div className="ar-sumi" key={s.k}>
                <div className="k">{s.k}</div>
                <div className="v">{s.v} {s.u && <em>{s.u}</em>}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ---------------- small parts ---------------- */

function Id({ k, v }) {
  return <div className="ar-idi"><div className="k">{k}</div><div className="v">{v}</div></div>;
}

const PLANS = ["Liberty", "Envolve", "UHC", "Health Choice", "AIHP", "Molina",
  "DentaQuest", "DCS / Liberty", "DCS / UHC", "Care 1st"];

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function DobPicker({ v, on }) {
  const [yy = "", mm = "", dd = ""] = (v || "").split("-");
  const thisYear = new Date().getFullYear();
  const years = Array.from({ length: 101 }, (_, i) => String(thisYear - i));
  // days available depend on the month, and on leap years for February
  const daysIn = (y, m) => (y && m ? new Date(Number(y), Number(m), 0).getDate() : 31);
  const max = daysIn(yy || String(thisYear), mm);
  const days = Array.from({ length: max }, (_, i) => String(i + 1).padStart(2, "0"));

  const set = (ny, nm, nd) => {
    if (!ny && !nm && !nd) return on("");
    // clamp the day if the new month is shorter (Mar 31 -> Feb)
    const cap = daysIn(ny, nm);
    const day = nd && Number(nd) > cap ? String(cap).padStart(2, "0") : nd;
    on(`${ny}-${nm}-${day}`);
  };

  return (
    <div className="ar-dob">
      <select className="mo" value={mm} data-empty={mm ? "0" : "1"}
        onChange={(e) => set(yy, e.target.value, dd)} aria-label="Birth month">
        <option value="">Month</option>
        {MONTHS.map((n, i) => (
          <option key={n} value={String(i + 1).padStart(2, "0")}>{n}</option>
        ))}
      </select>
      <select className="dy" value={dd} data-empty={dd ? "0" : "1"}
        onChange={(e) => set(yy, mm, e.target.value)} aria-label="Birth day">
        <option value="">Day</option>
        {days.map((d) => <option key={d} value={d}>{Number(d)}</option>)}
      </select>
      <select className="yr" value={yy} data-empty={yy ? "0" : "1"}
        onChange={(e) => set(e.target.value, mm, dd)} aria-label="Birth year">
        <option value="">Year</option>
        {years.map((y) => <option key={y} value={y}>{y}</option>)}
      </select>
    </div>
  );
}

function Hf({ l, v, on, type = "text", grow, times }) {
  return (
    <div className={`ar-hf ${grow ? "grow" : ""} ${times ? "times" : ""}`}>
      <label>{l}</label>
      <input type={type} value={v} onChange={(e) => on(e.target.value)}
        placeholder={type === "text" ? "—" : undefined} />
    </div>
  );
}

function In2({ l, v, on, opts, text, full, ph }) {
  return (
    <div className={`ar-in2 ${full ? "full" : ""}`}>
      <label>{l}</label>
      {opts
        ? <select value={v} onChange={(e) => on(e.target.value)}>
            {opts.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        : <input value={v} inputMode={text ? "text" : "decimal"} placeholder={ph}
            onChange={(e) => on(e.target.value)} />}
    </div>
  );
}

function PrintSheet({ preop: P, vitals, doses, waste, totals, extras, events, cols, totalOf,
  anesTotal, surgTotal, liveElapsed, aldreteTotal, bmi, months, allergyList, activeFlags,
  signedAt, onSign, onBack }) {

  const on = (o) => Object.keys(o || {}).filter((k) => o[k]);
  const t0 = toMin(P.anesStart);
  const tl = (t) => (t0 != null ? toHHMM(t0 + t) : String(t));
  const rows = Object.entries(vitals).map(([t, v]) => ({ t: +t, ...v }))
    .filter((r) => cols.includes(r.t)).sort((a, b) => a.t - b.t);

  const GW = 88, CW = 34, GHp = 150;
  const W = GW + cols.length * CW, yv = (v) => GHp - (v / 240) * GHp;
  const medRows = [...DRUGS, ...extras.filter((x) => x.name)];

  const downloadForPrint = () => {
    const el = document.querySelector(".pr");
    if (!el) return;
    const clone = el.cloneNode(true);
    clone.querySelectorAll(".no-print").forEach((nd) => nd.remove());
    const title = `${caseStem(P)}`;
    const html = [
      "<!doctype html><html><head><meta charset=\"utf-8\">",
      `<title>${title}</title>`,
      "<style>", CSS, " body{margin:0;background:#fff} ", "</style>",
      "<script>window.addEventListener('load',function(){setTimeout(function(){window.print()},400)})</scr" + "ipt>",
      "</head><body><div class=\"ar\">", clone.outerHTML, "</div></body></html>",
    ].join("");
    const blob = new Blob([html], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${caseStem(P)}.html`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  };
  const totalCell = (d) => d.fixedTotal ? d.fixedTotal
    : d.writeTotal ? (totals[d.id] ?? "")
    : totalOf(d.id) ? round(totalOf(d.id)) : "";

  return (
    <div className="pr">
      <div className="pr-toolbar no-print">
        <button onClick={downloadForPrint}>Download for print / PDF</button>
        <button className="alt" onClick={() => {
          const prev = document.title;
          document.title = caseStem(P);      // becomes the suggested PDF filename
          window.print();
          setTimeout(() => { document.title = prev; }, 1000);
        }}>Try direct print</button>
        {signedAt
          ? <button className="alt" onClick={() => onSign(null)}>Remove signature</button>
          : <button className="alt" onClick={() => onSign(new Date().toISOString())}>Sign &amp; date</button>}
        <button className="alt" onClick={onBack}>Back to record</button>
      </div>
      <div className="no-print" style={{ fontSize: 11, color: "#555", margin: "-6px 0 12px" }}>
        Downloads a single file of this record. Open it and the print dialog appears on its own —
        choose <b>Save as PDF</b> and pick Desktop as the destination. (Direct print is blocked
        inside this preview on most devices.)
      </div>

      <h1>Anesthesia Record</h1>
      <div className="pr-kv">
        <span><b>Patient:</b> {P.name || "—"}</span>
        <span><b>DOB:</b> {P.dob || "—"} ({fmtAge(months) ?? "—"})</span>
        <span><b>Gender:</b> {P.sex || "—"}</span>
        <span><b>ID:</b> {P.idNum || "—"}</span>
        <span><b>Plan:</b> {P.plan || "—"}</span>
        <span><b>Auth:</b> {P.authNum || "—"}</span>
        <span><b>Date:</b> {P.date}</span>
      </div>
      <div className="pr-kv" style={{ marginTop: 3 }}>
        <span><b>Wt:</b> {P.kg || "—"} kg</span>
        <span><b>Ht:</b> {P.heightIn || "—"} in</span>
        <span><b>BMI:</b> {bmi ?? "—"}</span>
        <span><b>ASA:</b> {P.asa}</span>
        <span><b>NPO solids:</b> {P.npoSolids || "—"}</span>
        <span><b>NPO clears:</b> {P.npoClears || "—"}</span>
        <span><b>Anes:</b> {P.anesStart || "—"}–{P.anesEnd || "—"} ({dur(anesTotal ?? liveElapsed) ?? "—"})</span>
        <span><b>Surg:</b> {P.surgStart || "—"}–{P.surgEnd || "—"} ({dur(surgTotal) ?? "—"})</span>
        <span><b>Units (15 min):</b> {anesTotal != null ? Math.ceil(anesTotal / 15) : "—"}</span>
      </div>

      <h2>Pre-op evaluation</h2>
      <div className="pr-kv">
        <span><b>BP:</b> {P.bp || "—"}</span>
        <span><b>HR:</b> {P.baseHr || "—"}</span>
        <span><b>SpO₂:</b> {P.baseSpo2 || "—"}</span>
        <span><b>RR:</b> {P.baseRr || "—"}</span>
        <span><b>Temp:</b> {P.baseTemp || "—"}</span>
        <span><b>MP:</b> {P.mp}</span>
        <span><b>ECG:</b> {P.ecg}</span>
        <span><b>CV:</b> {P.cvRRR ? "RRR w/o MRG" : "—"}</span>
        <span><b>Lungs:</b> {P.lungs || "—"}</span>
        <span><b>Allergies:</b> {P.nkda ? "NKDA" : (allergyList.join(", ") || "—")}</span>
      </div>
      {P.pmh && <div><b>Medical history:</b> {P.pmh}</div>}
      {P.meds && <div><b>Medications:</b> {P.meds}</div>}
      {P.notes && <div><b>Notes:</b> {P.notes}</div>}
      {activeFlags.length > 0 && <div><b>Flags:</b> {activeFlags.map((f) => f.label).join(" · ")}</div>}

      <h2>Case detail</h2>
      <div className="pr-kv">
        <span><b>Type:</b> {P.anesType}</span>
        <span><b>Monitors:</b> {on(P.monitors).join(", ") || "—"}</span>
      </div>
      <div className="pr-kv" style={{ marginTop: 3 }}>
        <span><b>IV:</b> {[P.ivSite, P.ivSide, P.ivSize && `${P.ivSize} ga`, P.ivAttempts && `${P.ivAttempts} attempt(s)`]
          .filter(Boolean).join(", ")}{P.ivNotes ? ` — ${P.ivNotes}` : ""}</span>
        <span><b>Airway:</b> {on(P.airway).map((k) => k === "NETT" ? `NETT #${P.nettSize || "—"}` : k === "OETT" ? `OETT #${P.oettSize || "—"}` : k).join(", ") || "—"}{P.airwayNotes ? ` — ${P.airwayNotes}` : ""}</span>
      </div>
      <div className="pr-kv" style={{ marginTop: 3 }}>
        <span><b>Technique:</b> {on(P.technique).join(", ") || "—"}</span>
      </div>
      <div className="pr-kv" style={{ marginTop: 3 }}>
        <span><b>Intubation:</b> {[...on(P.intub).map((k) => k === "KV" ? `KV #${P.kvSize}` : k),
          `Attempts ${P.intubAttempts || "—"}`, `Grade ${P.intubGrade || "—"} view`].join(", ")}</span>
        <span><b>Procedure:</b> {[...on(P.procs), P.procOther && (P.procOtherText || "✓")].filter(Boolean).join(", ") || "—"}</span>
        <span><b>Extubation:</b> {on(P.extub).join(", ") || "—"}</span>
      </div>

      <h2>Emergency medications — calculated for {P.kg || "—"} kg</h2>
      <div className="pr-kv">
        {EMERG_DRUGS.map((d) => (
          <span key={d.name}><b>{d.name}:</b>{" "}
            {parseFloat(P.kg) > 0
              ? `${doseFmt(emergDose(d, parseFloat(P.kg)))} ${d.unit}` +
                (d.mcg ? ` / ${mcgFmt(emergDose(d, parseFloat(P.kg)))} mcg` : "")
              : "—"}
            {" "}({d.perKg} {d.unit}/kg{d.cap != null ? `, max ${d.cap} ${d.unit}` : ""}
            {emergNote(d, parseFloat(P.kg) || 0) ? `, ${emergNote(d, parseFloat(P.kg) || 0)}` : ""})</span>
        ))}
      </div>

      <h2>Medications, gases &amp; fluids</h2>
      <table>
        <thead>
          <tr>
            <th className="l">Agent / drug</th><th>Total</th><th>Waste</th>
            {cols.map((t) => <th key={t}>{tl(t)}</th>)}
          </tr>
        </thead>
        <tbody>
          {medRows.map((d) => (
            <tr key={d.id}>
              <td className="l">{d.name}{d.unit ? ` (${d.unit})` : ""}</td>
              <td>{totalCell(d)}</td>
              <td>{d.noWaste ? "" : (waste[d.id] ?? "")}</td>
              {cols.map((t) => <td key={t}>{doses[t]?.[d.id] ?? ""}</td>)}
            </tr>
          ))}
        </tbody>
      </table>

      <h2>Vitals</h2>
      <table>
        <thead>
          <tr>
            <th className="l">Value</th><th></th><th></th>
            {cols.map((t) => <th key={t}>{tl(t)}</th>)}
          </tr>
        </thead>
        <tbody>
          <tr><td className="l">BP (S/D)</td><td></td><td></td>
            {cols.map((t) => <td key={t}>{vitals[t]?.sbp != null ? `${vitals[t].sbp}/${vitals[t].dbp}` : ""}</td>)}</tr>
          <tr><td className="l">HR</td><td></td><td></td>
            {cols.map((t) => <td key={t}>{vitals[t]?.hr ?? ""}</td>)}</tr>
          {NUMROWS.map((r) => (
            <tr key={r.id}><td className="l">{r.name}</td><td></td><td></td>
              {cols.map((t) => <td key={t}>{vitals[t]?.[r.id] ?? ""}</td>)}</tr>
          ))}
        </tbody>
      </table>

      <h2>Blood pressure &amp; heart rate</h2>
      <svg viewBox={`0 0 ${W} ${GHp}`} style={{ width: "100%", border: "1px solid #ccc" }}>
        {[0, 40, 80, 120, 160, 200, 240].map((v) => (
          <g key={v}>
            <line x1={GW} x2={W} y1={yv(v)} y2={yv(v)} stroke="#ddd" strokeWidth="0.6" />
            <text x={GW - 4} y={yv(v) + 2.5} textAnchor="end" fontSize="7" fill="#666"
              fontFamily="IBM Plex Mono, monospace">{v}</text>
          </g>
        ))}
        {cols.map((t, i) => (
          <line key={t} x1={GW + i * CW + CW / 2} x2={GW + i * CW + CW / 2} y1="0" y2={GHp}
            stroke={t % 15 === 0 ? "#bbb" : "#e4e4e4"} strokeWidth="0.6" />
        ))}
        <polyline fill="none" stroke="#111" strokeWidth="1"
          points={rows.filter((r) => r.hr != null)
            .map((r) => `${GW + cols.indexOf(r.t) * CW + CW / 2},${yv(r.hr)}`).join(" ")} />
        {rows.map((r) => {
          const cx = GW + cols.indexOf(r.t) * CW + CW / 2;
          return (
            <g key={r.t}>
              {r.sbp != null && <path d={`M${cx - 4},${yv(r.sbp) - 4.5} L${cx + 4},${yv(r.sbp) - 4.5} L${cx},${yv(r.sbp)} Z`} fill="#111" />}
              {r.dbp != null && <path d={`M${cx - 4},${yv(r.dbp) + 4.5} L${cx + 4},${yv(r.dbp) + 4.5} L${cx},${yv(r.dbp)} Z`} fill="#111" />}
              {r.hr != null && <circle cx={cx} cy={yv(r.hr)} r="2.2" fill="#fff" stroke="#111" strokeWidth="1" />}
            </g>
          );
        })}
      </svg>

      <h2>Events</h2>
      {Object.entries(events).filter(([, v]) => v.length).sort((a, b) => a[0] - b[0]).map(([t, list]) => (
        <div key={t}><span className="mono">{tl(+t)}</span> — {list.join(" · ")}</div>
      ))}

      <h2>Recovery &amp; discharge</h2>
      <div><b>Emergence:</b> {on(P.emerg).join("; ") || "—"}</div>
      <div><b>Course:</b> {P.uneventful ? "Uneventful anesthetic" : "—"}{P.comments ? ` — ${P.comments}` : ""}</div>
      <div><b>Discharge:</b> {[...on(P.disch), P.dischWith && `D/c with: ${P.dischWithText || "—"}`]
        .filter(Boolean).join("; ")}</div>
      <div><b>Aldrete:</b> {ALDRETE.map((r) => `${r.k} ${P.aldrete[r.k] ?? "—"}`).join(", ")} — total {aldreteTotal}/10</div>
      <div><b>Present:</b> Surgeon {P.surgeon || "—"}; Assistants {P.assistants || "—"}; Anesthesiologist {P.anesthesiologist || "—"}</div>

      <div className="pr-sig">
        <div>
          {signedAt && <div className="pr-signame">{P.anesthesiologist}</div>}
          Anesthesiologist signature — {P.anesthesiologist}
        </div>
        <div>
          {signedAt && <div className="pr-signame" style={{ fontStyle: "normal" }}>
            {new Date(signedAt).toLocaleDateString()}</div>}
          Date / time{signedAt ? " — electronically signed" : ""}
        </div>
      </div>
    </div>
  );
}

function IntubBox({ m, preop, P }) {
  return (
    <button className={`ar-check ${preop.intub[m] ? "on" : ""}`}
      role="checkbox" aria-checked={!!preop.intub[m]}
      onClick={() => P("intub", { ...preop.intub, [m]: !preop.intub[m] })}>
      <i /> {m}
    </button>
  );
}

function FixedCell({ cls, v, left, editing, onTap, onWrite, onCancel }) {
  if (editing) {
    return (
      <div className={`ar-sub ${cls}`} style={{ left }}>
        <input className="ar-cellin" autoFocus inputMode="decimal" defaultValue={v ?? ""}
          onFocus={(e) => e.target.select()}
          onBlur={(e) => onWrite(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); if (e.key === "Escape") onCancel(); }} />
      </div>
    );
  }
  return (
    <div className={`ar-sub ${cls}`} style={{ left }}>
      <button onClick={onTap}>{v != null && v !== "" ? v : <span className="empty">·</span>}</button>
    </div>
  );
}

function DoseCell({ row, t, q, sel, value, editing, seed, onTap, onWrite, onCancel, mode, dim }) {
  if (editing) {
    return (
      <div className={`ar-cell ${q ? "q" : ""} sel`}>
        <input className="ar-cellin" autoFocus inputMode={mode === "text" ? "text" : "decimal"}
          defaultValue={value ?? seed}
          onFocus={(e) => e.target.select()}
          onBlur={(e) => onWrite(e.target.value)}
          onKeyDown={(e) => {
            if (e.key === "Enter") e.target.blur();
            if (e.key === "Escape") onCancel();
          }} />
      </div>
    );
  }
  return (
    <button className={`ar-cell ${q ? "q" : ""} ${sel ? "sel" : ""}`} onClick={onTap}>
      {value != null
        ? <span className="ar-dose" style={dim ? { opacity: 0.55, fontStyle: "italic" } : undefined}>{value}</span>
        : <span className="empty">·</span>}
    </button>
  );
}

function Sel({ l, u, v, c, opts, on }) {
  return (
    <div className="ar-in">
      <label>{l}<b>{u}</b></label>
      <select className={`ar-selin ${c ? "carried" : ""}`} value={v || opts[0]}
        onChange={(e) => on(e.target.value)}>
        {opts.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
}

function Step({ l, u, v, c, s = 1, base, on }) {
  const dec = s < 1 ? 1 : 0;
  const bump = (d) => on(+(((Number(v) || 0) + d * s).toFixed(dec)));
  return (
    <div className="ar-in">
      <label>{l}<b>{u}{base ? ` · base ${base}` : ""}</b></label>
      <div className={`ar-step ${c ? "carried" : ""}`}>
        <button onClick={() => bump(-1)} aria-label={`Decrease ${l}`}>−</button>
        <input value={v ?? ""} inputMode="decimal"
          onChange={(e) => on(e.target.value === "" ? null : Number(e.target.value))} />
        <button onClick={() => bump(1)} aria-label={`Increase ${l}`}>+</button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<AnesthesiaRecord />);

</script>
</body>
</html>
